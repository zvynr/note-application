# Server (8081 behind API Gateway; gateway is public on 8080)
server.port=8081

# Public base URL used in verification / reset email links (gateway)
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}

# Token TTL (minutes) — keep short
security.token.verify-minutes=60
security.token.reset-minutes=15

# Max attempts per action (forgot / verify / reset) within window
security.attempts.max=5
security.attempts.window-minutes=15

# PostgreSQL Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/note}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:noteApplicationSecretKeyForJwtTokenGenerationAndValidation}
jwt.expiration=${JWT_EXPIRATION:54000000}

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=./uploads/profile-photos

# Redis cache
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# RabbitMQ (async email events → notification-service)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Swagger
springfox.documentation.swagger-ui.path=/note
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.main.allow-circular-references=true

